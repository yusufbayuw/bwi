name: Import reviewed emergency dependency manifests

on:
  push:
    branches: ['security/emergency-hardening']

permissions:
  contents: write
  actions: read

jobs:
  import-reviewed-lock:
    if: github.repository == 'yusufbayuw/bwi' && github.ref == 'refs/heads/security/emergency-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Retrieve manifests from successful read-only resolver
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: yusufbayuw/bwi
          run-id: 45325535178
          name: bwi-emergency-composer-manifests
          path: ${{ runner.temp }}/bwi-reviewed-manifests
      - name: Verify reviewed bytes and commit only Composer manifests
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/bwi-reviewed-manifests"
          (
            cd "$source_dir"
            printf '%s\n' 'efc2800f009a6b45ec6bdfb646f86477bb5c6872b252b3f61793ef340021538a  composer.json' '974d52b0795798a08894178e1c1d725f7e0a820faaa5067700134783e5b1f149  composer.lock' | sha256sum -c -
          )
          test "$(git hash-object composer.json)" = 5944108103065056fa17f638fd844889c5632611
          test "$(git hash-object composer.lock)" = a05e4f95f917a1e1ec6640b172af904fc5bf3ca0
          cp "$source_dir/composer.json" composer.json
          cp "$source_dir/composer.lock" composer.lock
          git add -- composer.json composer.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'security: commit reviewed Composer-generated Laravel 12 and Livewire 3.8.12 manifests'
          git push origin HEAD:refs/heads/security/emergency-hardening
