name: PHP syntax check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: |
          find app routes config database tests -name '*.php' -type f -print0 | xargs -0 -n1 php -l
